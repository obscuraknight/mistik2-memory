name: Bug report
description: Report a reproducible non-security defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private memory stores, or security vulnerabilities here. See SECURITY.md for private reporting."
  - type: input
    id: version
    attributes:
      label: Mistik2 Memory version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / OS / filesystem
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal synthetic reproduction
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
