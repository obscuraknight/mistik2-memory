name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        shard:
          - core
          - features
          - release
          - persistence
          - concurrency
          - transactions
          - tombstones
          - supersession
          - forgetting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pip check

      - name: Run core tests
        if: matrix.shard == 'core'
        run: >-
          python -m pytest -q
          tests/test_library.py tests/test_v1.py tests/test_invariants.py
          tests/test_regressions.py tests/test_review_fixes.py
          tests/test_identity_interpretation.py

      - name: Run feature tests
        if: matrix.shard == 'features'
        run: >-
          python -m pytest -q
          tests/test_provenance.py tests/test_audit.py tests/test_retrieval.py
          tests/test_associate.py tests/test_companion.py
          tests/test_locomo_layer.py tests/test_general_memory.py
          tests/test_general_memory_governance.py

      - name: Run release/benchmark tests
        if: matrix.shard == 'release'
        run: >-
          python -m pytest -q
          tests/test_release_hardening.py tests/test_benchmark.py tests/test_release_metadata.py

      - name: Run persistence tests
        if: matrix.shard == 'persistence'
        run: python -m pytest -q tests/test_persistence.py

      - name: Run concurrency tests
        if: matrix.shard == 'concurrency'
        run: python -m pytest -q tests/test_concurrency.py

      - name: Run transaction tests
        if: matrix.shard == 'transactions'
        run: python -m pytest -q tests/test_transactions.py

      - name: Run tombstone tests
        if: matrix.shard == 'tombstones'
        run: python -m pytest -q tests/test_tombstones.py

      - name: Run supersession tests
        if: matrix.shard == 'supersession'
        run: python -m pytest -q tests/test_supersession.py

      - name: Run forgetting tests
        if: matrix.shard == 'forgetting'
        run: python -m pytest -q tests/test_forgetting.py tests/test_identity_forgetting.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m compileall -q src tests
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - run: python -c "import mistik_memory; assert mistik_memory.__version__ == '2.2.0'; print(mistik_memory.__version__)"
