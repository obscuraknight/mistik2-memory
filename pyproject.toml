[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mistik2-memory"
version = "2.2.0"
description = "Governed long-term memory for AI systems with factual, episodic, semantic and procedural provenance, correction, forgetting and recoverable local persistence."
authors = [{name = "panosk"}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "memory", "agents", "llm", "provenance", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
mistik2-memory-bench = "mistik_memory.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
encryption = ["cryptography>=42"]
test = ["pytest>=8", "cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42", "build>=1.2"]

[tool.setuptools.package-data]
mistik_memory = ["aliases.json", "py.typed", "benchmark_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:forget_fact_with_details removes facts:DeprecationWarning"]
markers = ["v1_defaults: exercise production constructor defaults", "legacy_defaults: explicitly exercise pre-1.0 constructor defaults"]

[project.urls]
Documentation = "https://github.com/obscuraknight/mistik2-memory#readme"
Source = "https://github.com/obscuraknight/mistik2-memory"
Issues = "https://github.com/obscuraknight/mistik2-memory/issues"
